<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Playwright Spinner Demo</title>
<style>
body{font-family:Arial,sans-serif;margin:40px}.spinner{display:none;margin-top:20px}.spinner::after{content:"";display:inline-block;width:30px;height:30px;border:4px solid #ddd;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#finish{display:none;margin-top:20px;font-size:24px;font-weight:bold}
</style></head>
<body>
<h1>Dynamic Loading Spinner Demo</h1>
<button data-testid="start-button">Start</button>
<div id="loading" data-testid="loading-spinner" class="spinner" aria-label="Loading"></div>
<div id="finish" data-testid="final-result">Hello World!</div>
<script>
document.querySelector('[data-testid="start-button"]').addEventListener('click',()=>{
 const spinner=document.querySelector('[data-testid="loading-spinner"]');
 const result=document.querySelector('[data-testid="final-result"]');
 result.style.display='none'; spinner.style.display='block';
 setTimeout(()=>{ spinner.style.display='none'; result.style.display='block'; }, 1200);
});
</script>
</body></html>
